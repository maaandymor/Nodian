function addLogEntry(){document.getElementById('logText').value='';document.getElementById('logAuthor').value='';document.getElementById('logDate').value=new Date().toISOString().slice(0,10);document.getElementById('logOverlay').classList.add('open');setTimeout(()=>document.getElementById('logAuthor').focus(),50)}
function saveLog(){const text=document.getElementById('logText').value.trim();if(!text){toast('Digite o conteúdo');return}const p=db.projects.find(p=>p.id===currentProjectId);p.log.push({id:uid(),date:document.getElementById('logDate').value,author:document.getElementById('logAuthor').value.trim()||'Equipe',text});saveData(db);renderLog(p);closeLogModal();toast('Registro salvo')}
function removeLog(idx){const p=db.projects.find(p=>p.id===currentProjectId);p.log.splice(idx,1);saveData(db);renderLog(p)}
function closeLogModal(e){if(!e||e.target===document.getElementById('logOverlay'))document.getElementById('logOverlay').classList.remove('open')}

// ══ TASKS ══
function renderTasks(p){
  const board=document.getElementById('taskBoard');
  const cols=[{id:'todo',label:'A Fazer',cls:'tcol-todo'},{id:'doing',label:'Em Andamento',cls:'tcol-doing'},{id:'done',label:'Concluído',cls:'tcol-done'}];
  board.innerHTML=cols.map(col=>{
    const tasks=(p.tasks||[]).filter(t=>t.status===col.id);
    return`<div class=&quot;task-col&quot;>
      <div class=&quot;task-col-header ${col.cls}&quot;>${col.label} · ${tasks.length}</div>
      ${tasks.map(t=>{const gi=(p.tasks||[]).indexOf(t);return renderTaskCard(t,gi)}).join('')}
      <button class=&quot;btn btn-ghost btn-sm&quot; style=&quot;justify-content:flex-start;color:var(--color-gray);font-size:10px&quot; onclick=&quot;addTask('${col.id}')&quot;>+ Task completa</button>
    </div>`;
  }).join('');
}
function renderTaskCard(t,idx){
  const whoArr=Array.isArray(t.who)?t.who:(t.who?[t.who]:[]);
  const dcls=t.date?deadlineClass(t.date):'';
  const subs=t.subtasks&amp;&amp;t.subtasks.length>0?`<div class=&quot;subtasks&quot;>${t.subtasks.map((s,si)=>`<div class=&quot;subtask ${s.done?'done':''}&quot;><div class=&quot;subtask-check ${s.done?'checked':''}&quot; onclick=&quot;toggleSubtask(${idx},${si})&quot;></div><span>${escHtml(s.text)}</span></div>`).join('')}</div>`:'';
  return`<div class=&quot;task-card&quot;>
    <div style=&quot;display:flex;align-items:flex-start;justify-content:space-between;gap:4px&quot;>
      <div class=&quot;task-desc&quot;>${escHtml(t.desc)}</div>
      <div style=&quot;display:flex;gap:1px;flex-shrink:0&quot;>
        <button class=&quot;icon-btn&quot; style=&quot;font-size:10px&quot; onclick=&quot;editTask(${idx})&quot;>✎</button>
        <button class=&quot;icon-btn&quot; style=&quot;font-size:10px;color:var(--color-red)&quot; onclick=&quot;removeTask(${idx})&quot;>✕</button>
      </div>
    </div>
    <div class=&quot;task-meta&quot;>
      <div class=&quot;task-who-pills&quot;>${whoArr.map(w=>`<span class=&quot;task-who-pill&quot;>${escHtml(w)}</span>`).join('')}</div>
      ${t.date?`<span class=&quot;task-date ${dcls}&quot;>${formatDate(t.date)}</span>`:''}
    </div>
    ${subs}
  </div>`;
}
function addTask(defaultStatus){editingTaskIdx=null;tempTaskWho=[];document.getElementById('taskModalTitle').textContent='Nova Task';document.getElementById('taskDesc').value='';document.getElementById('taskDate').value=new Date().toISOString().slice(0,10);document.getElementById('taskStatus').value=defaultStatus||'todo';document.getElementById('taskSubtasks').value='';renderTaskWhoPills();renderPickerGrid('taskPickerGrid',tempTaskWho);document.getElementById('taskOverlay').classList.add('open');setTimeout(()=>document.getElementById('taskDesc').focus(),50)}
function editTask(idx){editingTaskIdx=idx;const p=db.projects.find(p=>p.id===currentProjectId);const t=p.tasks[idx];tempTaskWho=Array.isArray(t.who)?[...t.who]:(t.who?[t.who]:[]);document.getElementById('taskModalTitle').textContent='Editar Task';document.getElementById('taskDesc').value=t.desc;document.getElementById('taskDate').value=t.date||'';document.getElementById('taskStatus').value=t.status||'todo';document.getElementById('taskSubtasks').value=(t.subtasks||[]).map(s=>s.text).join('\n');renderTaskWhoPills();renderPickerGrid('taskPickerGrid',tempTaskWho);document.getElementById('taskOverlay').classList.add('open')}
function saveTask(){
  const desc=document.getElementById('taskDesc').value.trim();if(!desc){toast('Digite a descrição');return}
  const p=db.projects.find(p=>p.id===currentProjectId);
  const subtasks=document.getElementById('taskSubtasks').value.trim().split('\n').filter(l=>l.trim()).map((text,i)=>({id:uid(),text:text.trim(),done:editingTaskIdx!==null&amp;&amp;(p.tasks[editingTaskIdx].subtasks||[])[i]?.done||false}));
  const task={id:uid(),desc,who:[...tempTaskWho],date:document.getElementById('taskDate').value,status:document.getElementById('taskStatus').value,subtasks};
  if(!p.tasks)p.tasks=[];
  if(editingTaskIdx!==null)p.tasks[editingTaskIdx]=task;else p.tasks.push(task);
  saveData(db);renderTasks(p);closeTaskModal();toast('Task salva');
}
function removeTask(idx){const p=db.projects.find(p=>p.id===currentProjectId);p.tasks.splice(idx,1);saveData(db);renderTasks(p)}
function toggleSubtask(ti,si){const p=db.projects.find(p=>p.id===currentProjectId);p.tasks[ti].subtasks[si].done=!p.tasks[ti].subtasks[si].done;saveData(db);renderTasks(p)}
function closeTaskModal(e){if(!e||e.target===document.getElementById('taskOverlay'))document.getElementById('taskOverlay').classList.remove('open')}

// ══ IMPORT / EXPORT ══
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`nodian-tracker-${new Date().toISOString().slice(0,10)}.json`;a.click();toast('Exportado')}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.projects)throw 0;db=d;saveData(db);renderCurrentView();toast('Importado','success')}catch{toast('Erro ao importar')}};r.readAsText(file);e.target.value=''}

// ══ SUMMARY VIEW ══
function renderSummaryView(){
  const content=document.getElementById('summaryContent');
  const projects=getFilteredProjects().filter(p=>p.status!=='FINALIZADO');
  const now=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

  // Sort state
  const sortSel=document.getElementById('summarySort');
  const sortVal=sortSel?sortSel.value:'status';
  const sorted=[...projects].sort((a,b)=>{
    if(sortVal==='name') return a.name.localeCompare(b.name,'pt-BR');
    if(sortVal==='status'){
      const si=id=>STATUS_COLS.findIndex(c=>c.id===id);
      return si(a.status)-si(b.status);
    }
    if(sortVal==='team') return (a.team||[])[0]?.localeCompare((b.team||[])[0]||'')||0;
    if(sortVal==='log'){
      const ld=p=>p.log&amp;&amp;p.log.length>0?p.log[p.log.length-1].date:'';
      return ld(b).localeCompare(ld(a));
    }
    return 0;
  });

  content.innerHTML=`
    <div class=&quot;summary-toolbar&quot;>
      <div class=&quot;summary-toolbar-left&quot;>
        <div class=&quot;summary-toolbar-title&quot;>Planning · ${now} · ${projects.length} projetos ativos</div>
      </div>
      <div class=&quot;summary-toolbar-actions&quot;>
        <div style=&quot;display:flex;align-items:center;gap:6px&quot;>
          <span style=&quot;font-size:11px;font-weight:500;color:var(--color-gray)&quot;>Ordenar</span>
          <select id=&quot;summarySort&quot; class=&quot;summary-sort-sel&quot; onchange=&quot;renderSummaryView()&quot;>
            <option value=&quot;status&quot; ${sortVal==='status'?'selected':''}>Grupo Kanban</option>
            <option value=&quot;name&quot; ${sortVal==='name'?'selected':''}>Nome A–Z</option>
            <option value=&quot;team&quot; ${sortVal==='team'?'selected':''}>Time</option>
            <option value=&quot;log&quot; ${sortVal==='log'?'selected':''}>Último registro</option>
          </select>
        </div>
        <button class=&quot;btn btn-sm btn-secondary&quot; onclick=&quot;exportMarkdown()&quot;>↓ .md</button>
        <button class=&quot;btn btn-sm btn-secondary&quot; onclick=&quot;printSummary()&quot;>↓ PDF</button>
      </div>
    </div>
    <div class=&quot;summary-grid&quot;>${sorted.map(p=>renderSummaryCard(p)).join('')}</div>`;
}

function renderSummaryCard(p){
  const lastLog=p.log&amp;&amp;p.log.length>0?p.log[p.log.length-1]:null;
  const openTasks=(p.tasks||[]).filter(t=>t.status!=='done');
  const badgeCls=statusBadgeCls(p.status);
  const statusLabel=STATUS_COLS.find(c=>c.id===p.status)?.label||p.status;
  const teamAvatars=(p.team||[]).slice(0,5).map(t=>`<div class=&quot;avatar av-${t.toLowerCase()}&quot; style=&quot;width:18px;height:18px;font-size:7px&quot;>${t.slice(0,2)}</div>`).join('');

  const logBlock=lastLog?`
    <div class=&quot;summary-log&quot;>
      <div class=&quot;summary-log-meta&quot;>${escHtml(lastLog.author||'Equipe')} · ${formatDate(lastLog.date)}</div>
      ${escHtml(lastLog.text)}
    </div>`:'';

  const tasksBlock=openTasks.length>0?`
    <div>
      <div class=&quot;summary-tasks-title&quot;>Tasks (${openTasks.length})</div>
      <div class=&quot;summary-task-list&quot;>${openTasks.map(t=>{
        const whoArr=Array.isArray(t.who)?t.who:(t.who?[t.who]:[]);
        const dcls=t.date?deadlineClass(t.date):'';
        return`<div class=&quot;summary-task-item&quot;>
          <div class=&quot;summary-task-dot&quot;></div>
          <span style=&quot;flex:1&quot;>${escHtml(t.desc)}</span>
          ${whoArr.length?`<span class=&quot;summary-task-who&quot;>${escHtml(whoArr.join(', '))}</span>`:''}
          ${t.date?`<span class=&quot;summary-task-date ${dcls}&quot;>${formatDate(t.date)}</span>`:''}
        </div>`;
      }).join('')}</div>
    </div>`:`<div class=&quot;summary-no-tasks&quot;>Sem tasks abertas</div>`;

  return`<div class=&quot;summary-card&quot;>
    <div class=&quot;summary-card-header&quot;>
      <div>
        <div class=&quot;summary-card-name&quot;>${escHtml(p.name)}</div>
        <div class=&quot;summary-card-team&quot;>${teamAvatars}</div>
      </div>
      <span class=&quot;summary-status ${badgeCls}&quot;>${statusLabel}</span>
    </div>
    ${logBlock}
    ${tasksBlock}
  </div>`;
}

function printSummary(){
  setView('summary');
  setTimeout(()=>window.print(),150);
}

function captureCurrentViewPng(){
  if(currentView==='board') captureAsPng('board','nodian-kanban');
  else if(currentView==='summary') captureAsPng('summaryContent','nodian-resumo');
}

function captureAsPng(elementId, filename){
  const el=document.getElementById(elementId);
  if(!el){toast('Elemento não encontrado');return;}
  if(typeof html2canvas==='undefined'){toast('html2canvas não carregado');return;}
  toast('Gerando PNG…');
  const date=new Date().toISOString().slice(0,10);
  html2canvas(el,{
    scale:2,
    backgroundColor:'#f5f5f5',
    useCORS:true,
    logging:false,
    scrollX:0,
    scrollY:-window.scrollY,
    windowWidth:el.scrollWidth,
    windowHeight:el.scrollHeight,
  }).then(canvas=>{
    const link=document.createElement('a');
    link.download=`${filename}-${date}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast('PNG salvo!','success');
  }).catch(err=>{
    console.error(err);
    toast('Erro ao gerar PNG');
  });
}

// ══ EXPORT MARKDOWN ══
function exportMarkdown(){
  const now=new Date();
  const dateStr=now.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const projects=db.projects.filter(p=>p.status!=='FINALIZADO');
  const grouped={};
  STATUS_COLS.forEach(c=>{grouped[c.id]=[]});
  projects.forEach(p=>{if(grouped[p.status])grouped[p.status].push(p)});

  let md=`# Resumo de Planning — ${dateStr}\n\n`;
  md+=`> ${projects.length} projetos ativos · Gerado pelo Nodian Project Tracker\n\n`;
  md+=`---\n\n`;

  STATUS_COLS.forEach(col=>{
    const items=grouped[col.id];
    if(!items||items.length===0)return;
    md+=`## ${col.label} (${items.length})\n\n`;
    items.forEach(p=>{
      const team=(p.team||[]).join(', ');
      const lastLog=p.log&amp;&amp;p.log.length>0?p.log[p.log.length-1]:null;
      const openTasks=(p.tasks||[]).filter(t=>t.status!=='done');
      const active=(p.milestones||[]).find(m=>m.status==='active')||(p.milestones||[]).find(m=>m.status!=='done');

      md+=`### ${p.name}\n`;
      if(team)md+=`**Time:** ${team}  \n`;
      if(active)md+=`**Marco atual:** ${active.label}${active.date?' ('+formatDate(active.date)+')':''}  \n`;
      if(lastLog){
        md+=`**Último status** (${lastLog.author||'Equipe'} · ${formatDate(lastLog.date)}):  \n`;
        md+=`> ${lastLog.text}\n`;
      }
      if(openTasks.length>0){
        md+=`\n**Tasks abertas:**\n`;
        openTasks.forEach(t=>{
          const whoArr=Array.isArray(t.who)?t.who:(t.who?[t.who]:[]);
          const who=whoArr.length?` — *${whoArr.join(', ')}*`:'';
          const date=t.date?` · ${formatDate(t.date)}`:' · sem prazo';
          md+=`- [ ] ${t.desc}${who}${date}\n`;
          (t.subtasks||[]).filter(s=>!s.done).forEach(s=>{md+=`  - [ ] ${s.text}\n`});
        });
      }
      md+=`\n`;
    });
  });

  md+=`---\n*Exportado em ${now.toLocaleString('pt-BR')}*\n`;

  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`nodian-planning-${now.toISOString().slice(0,10)}.md`;
  a.click();URL.revokeObjectURL(a.href);
  toast('Exportado como .md','success');
}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.summary-card{background:var(--color-white);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .15s;border:1.5px solid transparent}

.summary-card-name{font-size:14px;font-weight:700;letter-spacing:-.2px}
.summary-log-block{background:var(--color-amber-25);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:10px}
.summary-log-meta{font-size:10px;font-weight:600;color:var(--txt-amb);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.summary-log-text{font-size:12px;color:var(--color-black);line-height:1.5}
.summary-tasks{display:flex;flex-direction:column;gap:4px}
.summary-task-item{display:flex;align-items:flex-start;gap:6px;font-size:12px}
.summary-task-check{width:12px;height:12px;border:1.5px solid rgba(22,22,22,.2);border-radius:3px;flex-shrink:0;margin-top:1px}
.summary-task-who{font-size:10px;font-weight:600;padding:1px 6px;border-radius:var(--radius-full);background:var(--color-bg);color:var(--color-gray);flex-shrink:0}
.summary-task-date{font-size:10px;color:var(--color-gray);flex-shrink:0}
.summary-task-date.overdue{color:var(--color-red);font-weight:600}
.summary-task-date.soon{color:var(--txt-amb);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(22,22,22,.45);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.overlay.open{display:flex}
.project-modal{background:var(--color-white);border-radius:var(--radius-xl);width:100%;max-width:860px;margin:auto;overflow:hidden;box-shadow:0 20px 60px rgba(22,22,22,.2)}
.modal-header{background:var(--color-bg);padding:20px 24px 16px;border-bottom:1px solid rgba(22,22,22,.08);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-header-content{flex:1;min-width:0}
.modal-project-name{font-size:22px;font-weight:700;letter-spacing:-.5px;outline:none;border-bottom:2px solid transparent;padding-bottom:2px;transition:border-color .2s;line-height:1.2;word-break:break-word}
.modal-project-name:focus{border-color:var(--color-amber)}

.modal-status-select{border:none;background:transparent;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;border-radius:var(--radius-full);padding:4px 10px;outline:none;-webkit-appearance:none}
.modal-body{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:380px}
.modal-section{padding:20px 24px;border-right:1px solid rgba(22,22,22,.06)}

.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--color-gray);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-footer{padding:16px 24px;border-top:1px solid rgba(22,22,22,.08);background:var(--color-bg)}
.team-field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.team-add-btn{border:1.5px dashed rgba(22,22,22,.2);background:transparent;border-radius:var(--radius-full);padding:3px 10px;font-family:var(--font);font-size:11px;font-weight:600;color:var(--color-gray);cursor:pointer;transition:all .15s}
.team-add-btn:hover{border-color:var(--color-amber);color:var(--color-amber)}
.person-picker{position:relative;display:inline-block}
.person-picker-dropdown{position:absolute;top:calc(100% + 4px);left:0;background:var(--color-white);border:1px solid rgba(22,22,22,.1);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:300;min-width:200px;padding:8px;display:none}
.person-picker-dropdown.open{display:block}
.person-picker-grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.person-picker-btn{border:1.5px solid rgba(22,22,22,.12);background:transparent;border-radius:var(--radius-full);padding:4px 10px;font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;color:var(--color-gray);transition:all .15s}
.person-picker-btn:hover{background:var(--color-bg)}
.person-picker-btn.selected{background:var(--color-black);color:var(--color-white);border-color:var(--color-black)}

.person-picker-btn.priority.selected{background:var(--color-black);color:var(--color-white);border-color:var(--color-black)}
.person-picker-divider{height:1px;background:rgba(22,22,22,.08);margin:4px 0}
.person-custom-input{width:100%;border:1.5px solid rgba(22,22,22,.1);border-radius:var(--radius-sm);padding:5px 8px;font-family:var(--font);font-size:11px;outline:none;transition:border-color .15s}
.person-custom-input:focus{border-color:var(--color-amber)}
.person-picker-actions{display:flex;justify-content:flex-end;margin-top:6px}
.milestones{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.milestone-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--color-bg);border:1px solid transparent;transition:border-color .15s;cursor:grab}
.milestone-item:hover{border-color:rgba(22,22,22,.08)}
.milestone-item.drag-over{border-color:var(--color-amber);background:var(--color-amber-25)}
.milestone-item.dragging{opacity:.4}
.milestone-drag{color:rgba(103,103,103,.4);font-size:12px;cursor:grab;user-select:none}
.milestone-status-btn{width:18px;height:18px;border-radius:50%;border:2px solid rgba(22,22,22,.2);background:transparent;cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:transparent}
.milestone-status-btn.active{border-color:var(--color-amber);background:var(--color-amber-25);color:var(--txt-amb)}
.milestone-status-btn.done{border-color:var(--color-green);background:var(--color-green);color:#fff}
.milestone-status-btn.blocked{border-color:var(--color-red);background:rgba(227,64,74,.1);color:var(--color-red)}
.milestone-label{flex:1;font-size:12px;font-weight:500;line-height:1.3;min-width:0}
.milestone-label.done{text-decoration:line-through;color:var(--color-gray)}
.milestone-type-sprint{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-amb);background:var(--color-amber-25);padding:1px 5px;border-radius:var(--radius-xs);margin-right:4px}
.milestone-date{font-size:10px;color:var(--color-gray);flex-shrink:0;min-width:52px;text-align:right}
.milestone-who-pills{display:flex;gap:2px;flex-wrap:wrap}
.milestone-who-pill{font-size:9px;font-weight:600;padding:1px 5px;border-radius:var(--radius-full);background:rgba(22,22,22,.07);color:var(--color-gray)}
.milestone-actions{display:flex;gap:2px;flex-shrink:0}
.sprint-item{background:rgba(246,179,89,.07);border-color:rgba(246,179,89,.2)!important}
.dash-checklist{display:flex;flex-direction:column;gap:4px}
.dash-check-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--radius-sm);background:var(--color-bg);font-size:12px;cursor:pointer;transition:background .15s}
.dash-check-item:hover{background:rgba(22,22,22,.05)}
.dash-check-box{width:14px;height:14px;border:2px solid rgba(22,22,22,.2);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:transparent;transition:all .2s}
.dash-check-box.checked{background:var(--color-green);border-color:var(--color-green);color:#fff}
.dash-check-label{flex:1;color:var(--color-black)}
.dash-check-label.done{text-decoration:line-through;color:var(--color-gray)}
.dash-check-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--color-gray);padding:6px 8px 2px;margin-top:4px}
.dash-checklist-wrap{max-height:260px;overflow-y:auto}
.log-list{display:flex;flex-direction:column;gap:0;max-height:380px;overflow-y:auto}
.log-entry{display:flex;gap:10px}
.log-timeline{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:14px}
.log-dot{width:10px;height:10px;border-radius:50%;background:var(--color-amber);flex-shrink:0;margin-top:3px}
.log-line{flex:1;width:2px;background:rgba(22,22,22,.06);margin:2px 0}
.log-content{flex:1;padding-bottom:14px;min-width:0}
.log-meta{font-size:10px;font-weight:600;color:var(--color-gray);margin-bottom:3px;display:flex;align-items:center;gap:4px}
.log-text{font-size:12px;line-height:1.5;word-break:break-word}
.tasks-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.task-col{display:flex;flex-direction:column;gap:6px}
.task-col-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;border-radius:var(--radius-sm)}
.tcol-todo{background:rgba(103,103,103,.08);color:var(--color-gray)}
.tcol-doing{background:var(--color-amber-25);color:var(--txt-amb)}
.tcol-done{background:var(--color-green-25);color:#0F6E56}
.task-card{background:var(--color-bg);border-radius:var(--radius-sm);padding:8px 10px;border:1px solid rgba(22,22,22,.06)}
.task-desc{font-size:12px;font-weight:500;line-height:1.3}
.task-meta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.task-who-pill{font-size:9px;font-weight:700;padding:1px 6px;border-radius:var(--radius-full);background:rgba(22,22,22,.08);color:var(--color-gray)}
.task-date{font-size:10px;color:var(--color-gray)}
.task-date.overdue{color:var(--color-red);font-weight:600}
.task-date.soon{color:var(--txt-amb);font-weight:600}
.task-who-pills{display:flex;gap:2px;flex-wrap:wrap}
.subtasks{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.subtask{display:flex;align-items:flex-start;gap:5px;font-size:11px;color:var(--color-gray);line-height:1.3}
.subtask.done{color:rgba(103,103,103,.5);text-decoration:line-through}
.subtask-check{width:12px;height:12px;border:1.5px solid rgba(22,22,22,.2);border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;margin-top:1px;color:transparent;transition:all .2s}
.subtask-check.checked{background:var(--color-green);border-color:var(--color-green);color:#fff}
.quick-task-inbox{display:flex;align-items:center;gap:8px;background:var(--color-bg);border-radius:var(--radius-md);padding:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.quick-inbox-input{flex:1;min-width:120px;border:none;background:transparent;font-family:var(--font);font-size:12px;outline:none;color:var(--color-black)}
.quick-inbox-input::placeholder{color:rgba(103,103,103,.4)}
.quick-inbox-who{border:none;background:var(--color-white);border-radius:var(--radius-sm);font-family:var(--font);font-size:11px;color:var(--color-gray);padding:3px 6px;cursor:pointer;outline:none}
.quick-inbox-date{border:none;background:var(--color-white);border-radius:var(--radius-sm);font-family:var(--font);font-size:11px;color:var(--color-gray);padding:3px 6px;cursor:pointer;outline:none}
.small-modal{background:var(--color-white);border-radius:var(--radius-xl);width:100%;max-width:440px;margin:auto;padding:24px;box-shadow:0 20px 60px rgba(22,22,22,.2)}
.modal-wide{max-width:560px}
.small-modal-title{font-size:16px;font-weight:700;margin-bottom:16px;letter-spacing:-.3px}
.form-row{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--color-gray)}
.form-input{border:1.5px solid rgba(22,22,22,.12);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s;background:var(--color-bg);width:100%}
.form-input:focus{border-color:var(--color-amber);background:var(--color-white)}
.form-select{border:1.5px solid rgba(22,22,22,.12);border-radius:var(--radius-sm);padding:7px 10px;font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s;background:var(--color-bg);width:100%;cursor:pointer}
.form-select:focus{border-color:var(--color-amber)}
.form-textarea{border:1.5px solid rgba(22,22,22,.12);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s;background:var(--color-bg);width:100%;resize:vertical;min-height:72px;line-height:1.5}
.form-textarea:focus{border-color:var(--color-amber);background:var(--color-white)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.preset-list{display:flex;flex-direction:column;gap:3px;margin-bottom:4px;max-height:200px;overflow-y:auto}
.preset-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;background:var(--color-bg);transition:background .15s;border:1px solid transparent}
.preset-item:hover{background:var(--color-amber-25);border-color:rgba(246,179,89,.3)}
.preset-item.selected{background:var(--color-amber-25);border-color:rgba(246,179,89,.4)}
.preset-item-icon{font-size:14px}
.preset-item-label{font-size:12px;font-weight:500;flex:1}
.preset-sub-indicator{font-size:9px;color:var(--txt-amb);font-weight:600;padding:1px 5px;border-radius:3px;background:var(--color-amber-25)}
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--color-black);color:var(--color-white);padding:8px 18px;border-radius:var(--radius-full);font-size:12px;font-weight:600;box-shadow:0 4px 16px rgba(22,22,22,.25);animation:toastIn .25s ease,toastOut .3s ease 2.3s forwards}
.toast.success{background:var(--color-green)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(4px)}}

/* ── PROJECT COLOR PICKER ── */
.project-color-row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.project-color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0}
.project-color-dot:hover{transform:scale(1.2)}
.project-color-dot.selected{border-color:var(--color-black);transform:scale(1.15)}
.project-color-swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
/* Cor no card kanban */
.card-color-bar{height:3px;border-radius:2px;margin-bottom:8px}
/* Week task — cor do projeto à esquerda */
.week-task-card{border-left-width:4px!important}

@media print{.topbar,.filter-bar,.dash-header,.btn,.summary-toolbar-actions,#btnCapturePng,.cal-day-add-btn{display:none!important}}

// ══ VIEW SWITCHING ══
function setView(v){
  currentView=v;
  ['board','list','week','cal','summary'].forEach(name=>{
    document.getElementById(name+'View').style.display=name===v?'block':'none';
    const tab=document.getElementById('tab'+name.charAt(0).toUpperCase()+name.slice(1));
    if(tab)tab.classList.toggle('active',name===v);
  });
  const titles={board:'Kanban',list:'Planning — Lista',week:'Semana',cal:'Calendário',summary:'Resumo da Planning'};
  document.getElementById('viewTitle').textContent=titles[v]+' ';
  const pngBtn=document.getElementById('btnCapturePng');
  if(pngBtn)pngBtn.style.display=(v==='board'||v==='summary')?'inline-flex':'none';
  renderCurrentView();
}
function renderCurrentView(){
  if(currentView==='board')renderBoard();
  else if(currentView==='list')renderPlanningList();
  else if(currentView==='week')renderWeekView();
  else if(currentView==='cal')renderCalendar();
  else renderSummaryView();
  const p=getFilteredProjects();
  document.getElementById('projectCount').textContent=`${db.projects.length} projetos · ${p.length} exibidos`;
}

// ══ FILTERS ══
function setPersonFilter(val,btn){filterPerson=val;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCurrentView()}
function setStatusFilter(val,btn){filterStatus=val;document.querySelectorAll('[data-status]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCurrentView()}
function getFilteredProjects(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  return db.projects.filter(p=>{
    if(filterStatus!=='all'&amp;&amp;p.status!==filterStatus)return false;
    if(filterPerson!=='all'&amp;&amp;!(p.team||[]).includes(filterPerson))return false;
    if(search&amp;&amp;!p.name.toLowerCase().includes(search))return false;
    return true;
  });
}

// ══ UTILS ══
function escHtml(s){if(!s)return'';return String(s).replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;')}
function formatDate(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function deadlineClass(d){if(!d)return'';const diff=(new Date(d)-new Date())/86400000;if(diff<0)return'overdue';if(diff<=5)return'soon';return''}
function statusBadgeCls(s){return{'PENDENTE':'badge-pendente','ANDAMENTO':'badge-andamento','BLOQUEADO':'badge-bloqueado','FINALIZADO':'badge-finalizado'}[s]||'badge-pendente'}
function avatarCls(t){return'av-'+t.toLowerCase()}
function toast(msg,type){const el=document.createElement('div');el.className='toast'+(type?' '+type:'');el.textContent=msg;document.getElementById('toastContainer').appendChild(el);setTimeout(()=>el.remove(),2600)}
function handleGlobalClick(e){
  if(!e.target.closest('.person-picker'))document.querySelectorAll('.person-picker-dropdown.open').forEach(d=>d.classList.remove('open'));
  if(!e.target.closest('.status-badge')&amp;&amp;!e.target.closest('.card-status-popup'))document.querySelectorAll('.card-status-popup.open').forEach(d=>d.classList.remove('open'));
}

function renderBoard(){
  const board=document.getElementById('board');
  const projects=getFilteredProjects();
  board.innerHTML=STATUS_COLS.map(col=>{
    const cp=projects.filter(p=>p.status===col.id);
    return`<div class=&quot;board-col&quot;
      ondragover=&quot;boardColDragOver(event,'${col.id}')&quot;
      ondrop=&quot;boardColDrop(event,'${col.id}')&quot;
      ondragleave=&quot;this.querySelectorAll('.project-card').forEach(c=>c.classList.remove('drag-over-card'))&quot;>
      <div class=&quot;col-header col-header-${col.cls}&quot;>
        <span class=&quot;col-title&quot;>${col.label}</span>
        <span class=&quot;col-count count-${col.cls}&quot;>${cp.length}</span>
      </div>
      ${cp.length===0?`<div class=&quot;col-empty&quot;>Nenhum projeto</div>`:cp.map(p=>renderCard(p)).join('')}
    </div>`;
  }).join('');
}

function renderCard(p){
  const lastLog=p.log&amp;&amp;p.log.length>0?p.log[p.log.length-1]:null;
  const logHtml=lastLog?`<div class=&quot;card-log&quot;>${escHtml(lastLog.text)}</div>`:`<div class=&quot;card-log card-log-empty&quot;>Sem registros</div>`;
  const next=[...(p.milestones||[]).filter(m=>m.date&amp;&amp;m.status!=='done').map(m=>({date:m.date,who:m.who})),...(p.tasks||[]).filter(t=>t.date&amp;&amp;t.status!=='done').map(t=>({date:t.date,who:t.who}))].sort((a,b)=>a.date.localeCompare(b.date))[0];
  const active=(p.milestones||[]).find(m=>m.status==='active')||(p.milestones||[]).find(m=>m.status!=='done');
  const stage=active?active.label:'Sem marcos';
  const team=(p.team||[]).slice(0,5).map(t=>`<div class=&quot;avatar ${avatarCls(t)}&quot;>${t.slice(0,2)}</div>`).join('');
  const badgeCls=statusBadgeCls(p.status);
  const statusLabel=STATUS_COLS.find(c=>c.id===p.status)?.label||p.status;
  const whoStr=next&amp;&amp;next.who?(Array.isArray(next.who)?next.who.join(', '):next.who):'';
  const dcls=next?deadlineClass(next.date):'';
  // Dash progress badge
  // contagem de tasks para o card
  const allTasks=(p.tasks||[]);
  const totalTasks=allTasks.length;
  const doneTasks=allTasks.filter(t=>t.status==='done').length;
  const dashProgress=totalTasks>0?`<div style=&quot;font-size:10px;color:var(--color-gray);margin-bottom:4px&quot;>${doneTasks}/${totalTasks} tasks</div>`:'';
  const statusOpts=STATUS_COLS.map(c=>`<div class=&quot;status-popup-item${p.status===c.id?' current':''}&quot; onclick=&quot;quickSetStatus('${p.id}','${c.id}',event)&quot;>${c.label}</div>`).join('');
  const pColorHex=getProjectColor(p);
  return`<div class=&quot;project-card&quot; draggable=&quot;true&quot;
      onclick=&quot;openProject('${p.id}')&quot;
      ondragstart=&quot;cardDragStart(event,'${p.id}')&quot;>
    <div class=&quot;card-color-bar&quot; style=&quot;background:${pColorHex}&quot;></div>
    <div class=&quot;card-top&quot;>
      <div class=&quot;card-name&quot;>${escHtml(p.name)}</div>
      <div style=&quot;position:relative&quot;>
        <span class=&quot;status-badge ${badgeCls}&quot; onclick=&quot;toggleStatusPopup('popup-${p.id}',event)&quot;>${escHtml(statusLabel)} ▾</span>
        <div class=&quot;card-status-popup&quot; id=&quot;popup-${p.id}&quot;>${statusOpts}</div>
      </div>
    </div>
    <div class=&quot;card-stage&quot;>${escHtml(stage)}</div>
    ${next?`<div class=&quot;card-deadline&quot;><span class=&quot;deadline-date ${dcls}&quot;>${formatDate(next.date)}</span>${whoStr?`<span style=&quot;font-size:9px;font-weight:600;background:var(--color-bg);border-radius:99px;padding:2px 7px&quot;>${escHtml(whoStr)}</span>`:''}</div>`:''}
    ${dashProgress}
    ${team?`<div class=&quot;card-team&quot;>${team}</div>`:''}
    ${logHtml}
  </div>`;
}

function toggleStatusPopup(popupId,e){e.stopPropagation();document.querySelectorAll('.card-status-popup.open').forEach(d=>{if(d.id!==popupId)d.classList.remove('open')});document.getElementById(popupId).classList.toggle('open')}
function quickSetStatus(pid,status,e){e.stopPropagation();const p=db.projects.find(p=>p.id===pid);if(!p)return;p.status=status;saveData(db);renderCurrentView();toast('Status atualizado')}

function cardDragStart(e,id){draggingCardId=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>{const card=document.querySelector(`[ondragstart*=&quot;${id}&quot;]`);if(card)card.classList.add('dragging')},0)}
function boardColDragOver(e,colId){e.preventDefault();e.dataTransfer.dropEffect='move'}
function boardColDrop(e,colId){
  e.preventDefault();if(!draggingCardId)return;
  const p=db.projects.find(p=>p.id===draggingCardId);
  if(p&amp;&amp;p.status!==colId){p.status=colId;saveData(db);renderCurrentView();toast(`Movido para ${STATUS_COLS.find(c=>c.id===colId)?.label||colId}`)}
  draggingCardId=null;
}

function renderWeekView(){
  const grid=document.getElementById('weekGrid');
  const projects=getFilteredProjects();
  const allTasks=[];
  projects.forEach(p=>{
    (p.tasks||[]).filter(t=>t.status!=='done').forEach(t=>{
      const whoArr=Array.isArray(t.who)?t.who:(t.who?[t.who]:[]);
      whoArr.forEach(w=>{allTasks.push({...t,person:w,projectId:p.id,projectName:p.name,projectStatus:p.status})});
      if(whoArr.length===0)allTasks.push({...t,person:'—',projectId:p.id,projectName:p.name,projectStatus:p.status});
    });
  });
  let people=filterPerson!=='all'?[filterPerson]:[...new Set(allTasks.map(t=>t.person))].sort((a,b)=>{
    const ia=TEAM_OPTIONS.indexOf(a),ib=TEAM_OPTIONS.indexOf(b);
    return(ia<0?99:ia)-(ib<0?99:ib);
  });
  if(people.length===0){grid.innerHTML='<div class=&quot;week-empty&quot; style=&quot;grid-column:1/-1&quot;>Nenhuma task aberta encontrada.</div>';return}
  grid.innerHTML=people.map(person=>{
    const tasks=allTasks.filter(t=>t.person===person).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
    const doingCount=tasks.filter(t=>t.status==='doing').length;
    const isPriority=TEAM_PRIORITY.includes(person);
    const av=`<div class=&quot;week-person-avatar ${avatarCls(person)}&quot; style=&quot;width:32px;height:32px;font-size:10px;font-weight:700&quot;>${person.slice(0,2)}</div>`;
    return`<div class=&quot;week-person-col&quot;>
      <div class=&quot;week-person-header&quot;>
        ${av}
        <div>
          <div class=&quot;week-person-name&quot;>${escHtml(person)}</div>
          <div class=&quot;week-person-count&quot;>${tasks.length} task${tasks.length!==1?'s':''} · ${doingCount} em andamento</div>
        </div>
      </div>
      ${tasks.length===0?`<div class=&quot;week-empty&quot;>Sem tasks abertas</div>`:tasks.map(t=>renderWeekTask(t)).join('')}
    </div>`;
  }).join('');
}

function renderWeekTask(t){

}

function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendar()}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendar()}
function calGoToday(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderCalendar()}

function renderCalendar(){
  document.getElementById('calMonthTitle').textContent=`${MONTH_NAMES[calMonth]} ${calYear}`;
  const grid=document.getElementById('calGrid');
  const today=new Date();
  const firstDay=new Date(calYear,calMonth,1);
  const lastDay=new Date(calYear,calMonth+1,0);
  const startDow=firstDay.getDay();
  const calEventsMonth=getCalEventsForMonth(calYear,calMonth);

  let html=`<div class=&quot;cal-dow-row&quot;>`;
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach((d,i)=>{
    html+=`<div class=&quot;cal-dow-cell${i===0||i===6?' weekend':''}&quot;>${d}</div>`;
  });
  html+=`</div><div class=&quot;cal-weeks&quot;>`;

  // Build days array (always start on Sunday)
  const days=[];
  for(let i=0;i<startDow;i++){days.push({date:new Date(calYear,calMonth,1-startDow+i),current:false})}
  for(let d=1;d<=lastDay.getDate();d++){days.push({date:new Date(calYear,calMonth,d),current:true})}
  while(days.length%7!==0){days.push({date:new Date(calYear,calMonth+1,days.length-startDow-lastDay.getDate()+1),current:false})}

  for(let w=0;w<days.length/7;w++){
    html+='<div class=&quot;cal-week-row&quot;>';
    for(let d=0;d<7;d++){
      const day=days[w*7+d];
      const isToday=day.date.toDateString()===today.toDateString();
      const isWeekend=d===0||d===6;
      const dateStr=day.date.toISOString().slice(0,10);
      const dayManualEvents=calEventsMonth.filter(e=>{
        const s=new Date(e.date);const end=e.dateEnd?new Date(e.dateEnd):s;
        const d=new Date(dateStr);return d>=s&amp;&amp;d<=end;
      });
      const msTaskEvents=getMilestoneEventsForDate(dateStr);
      const cls=['cal-day',!day.current?'other-month':'',isToday?'today':'',isWeekend?'weekend':''].filter(Boolean).join(' ');
      const MAX_VISIBLE=4;
      const allEvts=[...msTaskEvents,...dayManualEvents.map(e=>({...e,isManual:true}))];
      const visible=allEvts.slice(0,MAX_VISIBLE);
      const overflow=allEvts.length-visible.length;
      html+=`<div class=&quot;${cls}&quot; onclick=&quot;openCalDayEditor('${dateStr}')&quot;>
        <div class=&quot;cal-day-num&quot;>${day.date.getDate()}</div>
        <div class=&quot;cal-events&quot;>
          ${visible.map(ev=>{
            if(ev.isManual){
              // Evento manual — barra Gantt se multi-dia
              const evProj=ev.projectId?db.projects.find(p=>p.id===ev.projectId):null;
              const evColor=evProj?getProjectColor(evProj):'#f6b359';
              const pos=getEventBarPos(ev,dateStr);
              const isMulti=ev.dateEnd&amp;&amp;ev.date!==ev.dateEnd;
              const showLabel=pos==='start'||pos==='single'||isStartOfWeek(dateStr);
              const label=showLabel?escHtml(ev.desc):'';
              return`<div class=&quot;cal-gantt-bar bar-${pos}${isStartOfWeek(dateStr)&amp;&amp;pos==='mid'?' bar-start-of-week':''}&quot; style=&quot;background:${evColor}${isMulti?'33':'22'};color:${evColor};border:1px solid ${evColor}${isMulti?'77':'44'}&quot; onclick=&quot;event.stopPropagation();openCalEventEditor('${ev.id}','${dateStr}')&quot; title=&quot;${escHtml(ev.desc)}&quot;>${label}&amp;nbsp;</div>`;
            } else if(ev.isTask){
              // Task com prazo
              const tProj=db.projects.find(p=>p.id===ev.projectId);
              const tColor=tProj?getProjectColor(tProj):'#7295cd';
              return`<div class=&quot;cal-event-chip bar-task&quot; style=&quot;background:${tColor}22;color:${tColor};border:1px solid ${tColor}44&quot; onclick=&quot;event.stopPropagation();openProject('${ev.projectId}')&quot; title=&quot;${escHtml(ev.label)}&quot;>▸ ${escHtml(ev.label)}</div>`;
            } else {
              // Marco
              const msProj=db.projects.find(p=>p.id===ev.projectId);
              const msColor=msProj?getProjectColor(msProj):'#7295cd';
              return`<div class=&quot;cal-event-chip bar-milestone&quot; style=&quot;background:${msColor}22;color:${msColor};border:1px solid ${msColor}44;font-style:italic&quot; onclick=&quot;event.stopPropagation();openProject('${ev.projectId}')&quot; title=&quot;${escHtml(ev.label)}&quot;>◆ ${escHtml(ev.label)}</div>`;
            }
          }).join('')}
          ${overflow>0?`<div style=&quot;font-size:9px;color:var(--color-gray);padding:1px 4px&quot;>+${overflow}</div>`:''}
        </div>
        <button class=&quot;cal-day-add-btn&quot; onclick=&quot;event.stopPropagation();openCalDayEditor('${dateStr}')&quot;>+</button>
      </div>`;
    }
    html+='</div>';
  }
  html+='</div>';
  grid.innerHTML=html;
}

function getProjectStatus(pid){const p=db.projects.find(p=>p.id===pid);return p?p.status:'PENDENTE'}
function getMilestoneEventsForDate(dateStr){
  const result=[];
  db.projects.forEach(p=>{
    // Marcos com data exata
    (p.milestones||[]).forEach(m=>{
      if(m.date===dateStr){
        result.push({label:p.name+' · '+m.label,status:p.status,projectId:p.id,isMilestone:true});
      }
    });
    // Tasks com prazo neste dia
    (p.tasks||[]).filter(t=>t.date===dateStr&amp;&amp;t.status!=='done').forEach(t=>{
      result.push({label:p.name+' · '+t.desc,status:p.status,projectId:p.id,isMilestone:false,isTask:true});
    });
  });
  return result;
}
function getCalEventsForMonth(y,m){
  // Inclui eventos cujo intervalo (date..dateEnd) cruza o mês
  const monthStart=new Date(y,m,1);
  const monthEnd=new Date(y,m+1,0);
  return(db.calEvents||[]).filter(e=>{
    if(!e.date)return false;
    const start=new Date(e.date);
    const end=e.dateEnd?new Date(e.dateEnd):start;
    return start<=monthEnd&amp;&amp;end>=monthStart;
  });
}

// Retorna posição do evento num dia: 'start','mid','end','single'
function getEventBarPos(ev,dateStr){
  if(!ev.dateEnd||ev.date===ev.dateEnd)return'single';
  if(ev.date===dateStr)return'start';
  if(ev.dateEnd===dateStr)return'end';
  return'mid';
}
function isStartOfWeek(dateStr){return new Date(dateStr).getDay()===0}
function isEndOfWeek(dateStr){return new Date(dateStr).getDay()===6}

function openCalEventEditor(evId,dateStr){

function populateCalEventMilestone(){

function saveCalEvent(){
  const desc=document.getElementById('calEventDesc').value.trim();if(!desc){toast('Digite a descrição');return}
  const dateStart=document.getElementById('calEventDateStart').value||calEditingDate;
  const dateEnd=document.getElementById('calEventDateEnd').value||null;
  const pid=document.getElementById('calEventProject').value;
  const mid=document.getElementById('calEventMilestone').value;
  const who=document.getElementById('calEventWho').value;
  if(!db.calEvents)db.calEvents=[];
  const evData={desc,date:dateStart,dateEnd:dateEnd||null,projectId:pid||null,milestoneId:mid||null,who};
  if(calEditingEventId){
    const idx=db.calEvents.findIndex(e=>e.id===calEditingEventId);
    if(idx>=0)db.calEvents[idx]={...db.calEvents[idx],...evData};
  } else {
    db.calEvents.push({id:uid(),...evData});
  }
  saveData(db);closeCalEventModal();renderCalendar();toast('Evento salvo','success');
}
function deleteCalEvent(){
  if(!calEditingEventId||!confirm('Excluir este evento?'))return;

  saveData(db);closeCalEventModal();renderCalendar();toast('Evento excluído');

function renderSummaryView(){

function renderSummaryCard(p){
  const lastLog=p.log&amp;&amp;p.log.length>0?p.log[p.log.length-1]:null;
  const openTasks=(p.tasks||[]).filter(t=>t.status!=='done');
  const badgeCls=statusBadgeCls(p.status);

  const teamAvatars=(p.team||[]).slice(0,5).map(t=>`<div class=&quot;avatar av-${t.toLowerCase()}&quot; style=&quot;width:18px;height:18px;font-size:7px&quot;>${t.slice(0,2)}</div>`).join('');
  const logBlock=lastLog?`<div class=&quot;summary-log-block&quot;><div class=&quot;summary-log-meta&quot;>${escHtml(lastLog.author||'Equipe')} · ${formatDate(lastLog.date)}</div><div class=&quot;summary-log-text&quot;>${escHtml(lastLog.text)}</div></div>`:'';
  const tasksBlock=openTasks.length>0?`<div class=&quot;summary-tasks&quot;>${openTasks.slice(0,4).map(t=>{
    const whoArr=Array.isArray(t.who)?t.who:(t.who?[t.who]:[]);
    const dcls=t.date?deadlineClass(t.date):'';
    return`<div class=&quot;summary-task-item&quot;><div class=&quot;summary-task-check&quot;></div><span style=&quot;flex:1;font-size:12px&quot;>${escHtml(t.desc)}</span>${whoArr.map(w=>`<span class=&quot;summary-task-who&quot;>${escHtml(w)}</span>`).join('')}${t.date?`<span class=&quot;summary-task-date ${dcls}&quot;>${formatDate(t.date)}</span>`:''}</div>`;
  }).join('')}${openTasks.length>4?`<div style=&quot;font-size:11px;color:var(--color-gray);padding-left:18px&quot;>+${openTasks.length-4} mais</div>`:''}</div>`:'';
  return`<div class=&quot;summary-card&quot; onclick=&quot;openProject('${p.id}')&quot;>

      <div>

function renderColorPicker(currentColor){

    <div class=&quot;project-color-dot${(currentColor||'blue')===col.id?' selected':''}&quot;

  const p=db.projects.find(p=>p.id===currentProjectId);if(!p)return;

}
function renderPickerGrid(gridId,selected){
  const grid=document.getElementById(gridId);if(!grid)return;
  // Priority group first, then divider, then rest
  const priorityHtml=TEAM_PRIORITY.map(t=>{
    const isSel=selected.includes(t);
    return`<button class=&quot;person-picker-btn priority${isSel?' selected':''}&quot; onclick=&quot;togglePerson('${t}','${gridId}',event)&quot;>${t}</button>`;
  }).join('');
  const restHtml=TEAM_OPTIONS.filter(t=>!TEAM_PRIORITY.includes(t)).map(t=>{
    const isSel=selected.includes(t);
    return`<button class=&quot;person-picker-btn${isSel?' selected':''}&quot; onclick=&quot;togglePerson('${t}','${gridId}',event)&quot;>${t}</button>`;
  }).join('');

function togglePersonPicker(dropId,e){e.stopPropagation();document.querySelectorAll('.person-picker-dropdown.open').forEach(d=>{if(d.id!==dropId)d.classList.remove('open')});document.getElementById(dropId).classList.toggle('open')}
function closePersonPicker(dropId){document.getElementById(dropId).classList.remove('open')}
function togglePerson(person,gridId,e){
  e.stopPropagation();
  const ctx=gridId.includes('modal')?'modal':gridId.includes('milestone')?'milestone':'task';
  if(ctx==='modal'){const i=tempModalTeam.indexOf(person);if(i>=0)tempModalTeam.splice(i,1);else tempModalTeam.push(person);renderModalTeamPills();renderPickerGrid('modalPickerGrid',tempModalTeam)}
  else if(ctx==='milestone'){const i=tempMilestoneWho.indexOf(person);if(i>=0)tempMilestoneWho.splice(i,1);else tempMilestoneWho.push(person);renderMilestoneWhoPills();renderPickerGrid('milestonePickerGrid',tempMilestoneWho)}
  else if(ctx==='task'){const i=tempTaskWho.indexOf(person);if(i>=0)tempTaskWho.splice(i,1);else tempTaskWho.push(person);renderTaskWhoPills();renderPickerGrid('taskPickerGrid',tempTaskWho)}
}
function handleCustomPersonKey(e,ctx){
  if(e.key!=='Enter')return;const val=e.target.value.trim().toUpperCase();if(!val)return;
  if(ctx==='modal'&amp;&amp;!tempModalTeam.includes(val)){tempModalTeam.push(val);renderModalTeamPills();renderPickerGrid('modalPickerGrid',tempModalTeam)}
  if(ctx==='milestone'&amp;&amp;!tempMilestoneWho.includes(val)){tempMilestoneWho.push(val);renderMilestoneWhoPills();renderPickerGrid('milestonePickerGrid',tempMilestoneWho)}
  if(ctx==='task'&amp;&amp;!tempTaskWho.includes(val)){tempTaskWho.push(val);renderTaskWhoPills();renderPickerGrid('taskPickerGrid',tempTaskWho)}
  e.target.value='';
}
function removePerson(p,ctx){
  if(ctx==='modal'){tempModalTeam=tempModalTeam.filter(x=>x!==p);renderModalTeamPills();renderPickerGrid('modalPickerGrid',tempModalTeam)}
  if(ctx==='milestone'){tempMilestoneWho=tempMilestoneWho.filter(x=>x!==p);renderMilestoneWhoPills();renderPickerGrid('milestonePickerGrid',tempMilestoneWho)}
  if(ctx==='task'){tempTaskWho=tempTaskWho.filter(x=>x!==p);renderTaskWhoPills();renderPickerGrid('taskPickerGrid',tempTaskWho)}
}
function pillsHtml(arr,ctx){return arr.map(p=>`<div class=&quot;team-pill&quot;>${escHtml(p)}<button class=&quot;team-pill-remove&quot; onclick=&quot;removePerson('${p}','${ctx}')&quot;>✕</button></div>`).join('')}
function renderModalTeamPills(){const f=document.getElementById('modalTeamField');const pk=document.getElementById('modalTeamPicker');f.innerHTML='';f.insertAdjacentHTML('beforeend',pillsHtml(tempModalTeam,'modal'));f.appendChild(pk);saveCurrentProject()}

function renderMilestones(p){
  const list=document.getElementById('milestonesList');
  if(!p.milestones||p.milestones.length===0){list.innerHTML='<div style=&quot;color:var(--color-gray);font-size:12px;text-align:center;padding:12px 0&quot;>Nenhum marco. Clique em + Marco para adicionar.</div>';return}
  list.innerHTML=p.milestones.map((m,i)=>{
    const isSprint=m.type==='sprint';
    const whoArr=Array.isArray(m.who)?m.who:(m.who?[m.who]:[]);
    const whoPills=whoArr.map(w=>`<span class=&quot;milestone-who-pill&quot;>${escHtml(w)}</span>`).join('');
    return`<div class=&quot;milestone-item ${isSprint?'sprint-item':''}&quot; draggable=&quot;true&quot; data-idx=&quot;${i}&quot;
      ondragstart=&quot;dragMilestone(event,${i})&quot; ondragover=&quot;dragOverMilestone(event,${i})&quot;
      ondrop=&quot;dropMilestone(event,${i})&quot; ondragleave=&quot;this.classList.remove('drag-over')&quot;>
      <span class=&quot;milestone-drag&quot;>⠿</span>
      <button class=&quot;milestone-status-btn ${m.status}&quot; onclick=&quot;cycleMilestoneStatus(${i})&quot; title=&quot;Ciclar status&quot;>${m.status==='done'?'✓':m.status==='active'?'●':''}</button>
      <div class=&quot;milestone-label ${m.status==='done'?'done':''}&quot;>
        ${isSprint?`<span class=&quot;milestone-type-sprint&quot;>Sprint</span>`:''}${escHtml(m.label)}
      </div>
      <span class=&quot;milestone-date&quot;>${m.date?formatDate(m.date):'—'}</span>
      <div class=&quot;milestone-who-pills&quot;>${whoPills||'<span class=&quot;milestone-who-pill&quot;>—</span>'}</div>
      <div class=&quot;milestone-actions&quot;>
        <button class=&quot;icon-btn&quot; style=&quot;font-size:10px&quot; onclick=&quot;openMilestoneModal(${i},'${m.type||'milestone'}')&quot;>✎</button>
        <button class=&quot;icon-btn&quot; style=&quot;font-size:10px;color:var(--color-red)&quot; onclick=&quot;removeMilestone(${i})&quot;>✕</button>
      </div>

  }).join('');
}
function cycleMilestoneStatus(idx){const p=db.projects.find(p=>p.id===currentProjectId);const order=['pending','active','done','blocked'];p.milestones[idx].status=order[(order.indexOf(p.milestones[idx].status)+1)%order.length];saveData(db);renderMilestones(p)}
function dragMilestone(e,i){dragSrcIdx=i;e.target.closest('.milestone-item').classList.add('dragging')}
function dragOverMilestone(e,i){e.preventDefault();document.querySelectorAll('.milestone-item').forEach(el=>el.classList.remove('drag-over'));e.currentTarget.classList.add('drag-over')}
function dropMilestone(e,i){e.preventDefault();if(dragSrcIdx===null||dragSrcIdx===i)return;const p=db.projects.find(p=>p.id===currentProjectId);const m=p.milestones.splice(dragSrcIdx,1)[0];p.milestones.splice(i,0,m);saveData(db);renderMilestones(p);dragSrcIdx=null}
function removeMilestone(idx){const p=db.projects.find(p=>p.id===currentProjectId);p.milestones.splice(idx,1);saveData(db);renderMilestones(p)}

function openMilestoneModal(idx,type){

function saveMilestone(){

function renderTasks(p){
  const board=document.getElementById('taskBoard');
  const cols=[{id:'todo',label:'A Fazer',cls:'tcol-todo'},{id:'doing',label:'Em Andamento',cls:'tcol-doing'},{id:'done',label:'Concluído',cls:'tcol-done'}];
  board.innerHTML=cols.map(col=>{
    const tasks=(p.tasks||[]).filter(t=>t.status===col.id);
    return`<div class=&quot;task-col&quot;>
      <div class=&quot;task-col-header ${col.cls}&quot;>${col.label} · ${tasks.length}</div>
      ${tasks.map(t=>{const gi=(p.tasks||[]).indexOf(t);return renderTaskCard(t,gi)}).join('')}
      <button class=&quot;btn btn-ghost btn-sm&quot; style=&quot;justify-content:flex-start;color:var(--color-gray);font-size:10px&quot; onclick=&quot;addTask('${col.id}')&quot;>+ Task</button>
    </div>`;
  }).join('');
}
function renderTaskCard(t,idx){
  const whoArr=Array.isArray(t.who)?t.who:(t.who?[t.who]:[]);
  const dcls=t.date?deadlineClass(t.date):'';
  const subs=t.subtasks&amp;&amp;t.subtasks.length>0?`<div class=&quot;subtasks&quot;>${t.subtasks.map((s,si)=>`<div class=&quot;subtask ${s.done?'done':''}&quot;><div class=&quot;subtask-check ${s.done?'checked':''}&quot; onclick=&quot;toggleSubtask(${idx},${si})&quot;>✓</div><span>${escHtml(s.text)}</span></div>`).join('')}</div>`:'';
  return`<div class=&quot;task-card&quot;>
    <div style=&quot;display:flex;align-items:flex-start;justify-content:space-between;gap:4px&quot;>
      <div class=&quot;task-desc&quot;>${escHtml(t.desc)}</div>
      <div style=&quot;display:flex;gap:1px;flex-shrink:0&quot;>
        <button class=&quot;icon-btn&quot; style=&quot;font-size:10px&quot; onclick=&quot;editTask(${idx})&quot;>✎</button>
        <button class=&quot;icon-btn&quot; style=&quot;font-size:10px;color:var(--color-red)&quot; onclick=&quot;removeTask(${idx})&quot;>✕</button>
      </div>
    </div>
    <div class=&quot;task-meta&quot;>
      <div class=&quot;task-who-pills&quot;>${whoArr.map(w=>`<span class=&quot;task-who-pill&quot;>${escHtml(w)}</span>`).join('')}</div>
      ${t.date?`<span class=&quot;task-date ${dcls}&quot;>${formatDate(t.date)}</span>`:''}
    </div>
    ${subs}
  </div>`;
}
function addTask(defaultStatus){editingTaskIdx=null;tempTaskWho=[];document.getElementById('taskModalTitle').textContent='Nova Task';document.getElementById('taskDesc').value='';document.getElementById('taskDate').value=new Date().toISOString().slice(0,10);document.getElementById('taskStatus').value=defaultStatus||'todo';document.getElementById('taskSubtasks').value='';renderTaskWhoPills();renderPickerGrid('taskPickerGrid',tempTaskWho);document.getElementById('taskOverlay').classList.add('open');setTimeout(()=>document.getElementById('taskDesc').focus(),50)}
function editTask(idx){editingTaskIdx=idx;const p=db.projects.find(p=>p.id===currentProjectId);const t=p.tasks[idx];tempTaskWho=Array.isArray(t.who)?[...t.who]:(t.who?[t.who]:[]);document.getElementById('taskModalTitle').textContent='Editar Task';document.getElementById('taskDesc').value=t.desc;document.getElementById('taskDate').value=t.date||'';document.getElementById('taskStatus').value=t.status||'todo';document.getElementById('taskSubtasks').value=(t.subtasks||[]).map(s=>s.text).join('\n');renderTaskWhoPills();renderPickerGrid('taskPickerGrid',tempTaskWho);document.getElementById('taskOverlay').classList.add('open')}
function saveTask(){
  const desc=document.getElementById('taskDesc').value.trim();if(!desc){toast('Digite a descrição');return}
  const p=db.projects.find(p=>p.id===currentProjectId);
  const subtasks=document.getElementById('taskSubtasks').value.trim().split('\n').filter(l=>l.trim()).map((text,i)=>({id:uid(),text:text.trim(),done:editingTaskIdx!==null&amp;&amp;(p.tasks[editingTaskIdx].subtasks||[])[i]?.done||false}));
  const task={id:uid(),desc,who:[...tempTaskWho],date:document.getElementById('taskDate').value,status:document.getElementById('taskStatus').value,subtasks};
  if(!p.tasks)p.tasks=[];
  if(editingTaskIdx!==null)p.tasks[editingTaskIdx]=task;else p.tasks.push(task);
  saveData(db);renderTasks(p);closeTaskModal();toast('Task salva');
}
function removeTask(idx){const p=db.projects.find(p=>p.id===currentProjectId);p.tasks.splice(idx,1);saveData(db);renderTasks(p)}
function toggleSubtask(ti,si){const p=db.projects.find(p=>p.id===currentProjectId);p.tasks[ti].subtasks[si].done=!p.tasks[ti].subtasks[si].done;saveData(db);renderTasks(p)}
function closeTaskModal(e){if(!e||e.target===document.getElementById('taskOverlay'))document.getElementById('taskOverlay').classList.remove('open')}

function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`atlas-tracker-${new Date().toISOString().slice(0,10)}.json`;a.click();toast('Exportado')}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.projects)throw 0;db=d;if(!db.calEvents)db.calEvents=[];saveData(db);renderCurrentView();toast('Importado','success')}catch{toast('Erro ao importar')}};r.readAsText(file);e.target.value=''}
function captureCurrentViewPng(){
  const el=document.getElementById(currentView==='cal'?'calGrid':currentView==='board'?'boardView':'summaryView');
  if(!el||typeof html2canvas==='undefined'){toast('Gerando PNG...');return}
  html2canvas(el,{scale:2,backgroundColor:'#f5f5f5',useCORS:true,logging:false,scrollX:0,scrollY:-window.scrollY,windowWidth:el.scrollWidth,windowHeight:el.scrollHeight}).then(canvas=>{const a=document.createElement('a');a.download=`atlas-${currentView}-${new Date().toISOString().slice(0,10)}.png`;a.href=canvas.toDataURL();a.click();toast('PNG exportado','success')});
}
function exportMarkdown(){
  const now=new Date();
  let md=`# Atlas Planning — ${now.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}\n\n`;
  STATUS_COLS.forEach(col=>{
    const grp=db.projects.filter(p=>p.status===col.id&amp;&amp;p.status!=='FINALIZADO');
    if(grp.length===0)return;
    md+=`## ${col.label}\n\n`;
    grp.forEach(p=>{
      const active=(p.milestones||[]).find(m=>m.status==='active')||(p.milestones||[]).find(m=>m.status!=='done');
      const team=(p.team||[]).join(', ');
      md+=`### ${p.name}${team?` — *${team}*`:''}\n`;
      if(active)md+=`Marco atual: **${active.label}**${active.date?' · '+formatDate(active.date):''}\n`;
      const lastLog=p.log&amp;&amp;p.log.length>0?p.log[p.log.length-1]:null;
      if(lastLog)md+=`> ${lastLog.author||'Equipe'} · ${formatDate(lastLog.date)}: ${lastLog.text}\n`;
      const openTasks=(p.tasks||[]).filter(t=>t.status!=='done');
      if(openTasks.length>0){
        md+=`\n**Tasks:**\n`;
        openTasks.forEach(t=>{
          const whoArr=Array.isArray(t.who)?t.who:(t.who?[t.who]:[]);
          md+=`- [ ] ${t.desc}${whoArr.length?` — *${whoArr.join(', ')}*`:''}${t.date?' · '+formatDate(t.date):''}\n`;
          (t.subtasks||[]).filter(s=>!s.done).forEach(s=>{md+=`  - [ ] ${s.text}\n`});
        });
      }
      md+='\n';
    });
  });
  md+=`---\n*Exportado em ${now.toLocaleString('pt-BR')}*\n`;
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`atlas-planning-${now.toISOString().slice(0,10)}.md`;a.click();URL.revokeObjectURL(a.href);toast('Exportado como .md','success');
}


</script>
